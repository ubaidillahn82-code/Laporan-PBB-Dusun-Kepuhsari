<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laporan PBB Dusun Kepuhsari</title>
<meta name="theme-color" content="#1f6b45">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f2;--card:#fff;--tx:#1d2a22;--mut:#66736b;--bd:#dde2db;--pri:#1f6b45;--pri2:#e4f1e9;--bad:#b3392f;--bad2:#f8e5e2;--warn:#a86a0b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b2420;--tx:#e6ede8;--mut:#9aa89f;--bd:#2c3a33;--pri:#4cb582;--pri2:#1f3a2c;--bad:#e5766c;--bad2:#3a2421;--warn:#e0a54a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 6px;max-width:1150px;margin:auto}
h1{font-size:20px;margin:0}header p{margin:2px 0 0;color:var(--mut);font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:1150px;margin:auto}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;font:inherit}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:1150px;margin:auto;padding:6px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
select,input,textarea,.btn{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
input[type=checkbox]{width:18px;height:18px;padding:0}
.btn{background:var(--pri);color:#fff;border-color:var(--pri);cursor:pointer}.btn.sec{background:var(--card);color:var(--tx)}.btn.del{background:none;color:var(--bad);padding:4px 8px}.btn.sm{padding:4px 9px;font-size:13px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.sum b{display:block;font-size:19px}
.mut{color:var(--mut);font-size:13px}.ok{color:var(--pri)}.bad{color:var(--bad)}.wn{color:var(--warn)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--bd);padding:7px 8px;text-align:right;white-space:nowrap}
td.l,th.l{text-align:left}th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
.st{border:0;border-radius:12px;padding:3px 10px;font-size:12px;cursor:pointer;font-weight:600}.st.ok{background:var(--pri2);color:var(--pri)}.st.no{background:var(--bad2);color:var(--bad)}
.st-sel{padding:3px 6px;font-size:12px;font-weight:600}.st-sel.ok{color:var(--pri)}.st-sel.no{color:var(--bad)}.st-sel.wn{color:var(--warn)}
.ic,.sh,.cards,.fab{display:none}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 4px;margin-bottom:6px}
.sp{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}.sp1{display:flex;justify-content:space-between;gap:10px}.sp .mut{margin-top:2px;word-break:break-word}.sp3{display:flex;gap:8px;align-items:center;margin-top:10px}.sp3 select{flex:1;min-height:40px}
@media(max-width:720px){
body{font-size:16px;padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
header{padding:14px 14px 4px}h1{font-size:18px}main{padding:6px 12px 24px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;max-width:none;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));gap:0;background:var(--card);border-top:1px solid var(--bd);overflow:hidden;justify-content:space-around}
nav button{flex:1;border:0;border-radius:10px;background:none;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
nav button.on{background:var(--pri2);color:var(--pri)}
nav .ic{display:block;font-size:19px;line-height:1.1}nav .lg{display:none}nav .sh{display:block;font-size:10px;font-weight:600}
.tbl,.tmb{display:none}.cards{display:block}
.fab{display:block;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:27px;font-size:28px;line-height:1;padding:0;box-shadow:0 4px 14px #0004;z-index:15}
.card.lst{background:none;border:0;padding:0}
select,input,textarea,.btn{font-size:16px;min-height:42px}input[type=checkbox],input[type=radio]{min-height:0}
.sum{grid-template-columns:1fr 1fr;gap:8px}.sum b{font-size:16px}.sum div{padding:10px}
dialog{margin:auto 0 0;width:100%;max-width:none;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.fg{grid-template-columns:1fr}
}
.bar2{height:10px;background:var(--bad2);border-radius:5px;overflow:hidden;margin:8px 0 4px}.bar2 i{display:block;height:100%;background:var(--pri)}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);max-width:520px;width:calc(100% - 24px);padding:16px}
dialog::backdrop{background:#0007}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fg label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}.fg .f{grid-column:1/-1}
textarea{width:100%;min-height:90px;font:12px monospace}
@media print{nav,.bar,.noprint,.act{display:none!important}body{background:#fff;color:#000}th{position:static}}
</style>
</head>

function ss(id,v){const r=by(id);r.t=v;norm(r);save();draw()}
function rm(id){const r=by(id);if(confirm('Hapus SPPT '+r.s+' atas nama '+(r.n||'-')+'?')){D=D.filter(x=>x.id!==id);save();draw()}}
function edit(id){const r=id?by(id):{s:'',n:'',w:'',a:'',o:'',b:0,g:0,p:0,l:false,z:false,t:'belum'};const f=(k,t,lb,c)=>`<label class="${c||''}">${lb}<input id="f_${k}" type="${t}" value="${esc(r[k])}"></label>`;
  $('dlg').innerHTML=`<b>${id?'Ubah':'Tambah'} SPPT</b><div class="fg" style="margin-top:10px">${f('s','text','No SPPT','f')}${f('n','text','Nama sesuai SPPT')}${f('w','text','Nama wajib pajak')}${f('a','text','Alamat wajib pajak')}${f('o','text','Alamat obyek')}${f('b','number','Luas bumi')}${f('g','number','Luas bangunan')}${f('p','number','Setoran pajak (Rp)','f')}
  <label class="f">Status<select id="f_t">${Object.entries(ST).map(([k,v])=>`<option value="${k}"${r.t===k?' selected':''}>${v}</option>`).join('')}</select></label></div>
  <div class="bar" style="margin:14px 0 0"><button class="btn" onclick="sv(${id||0})">Simpan</button><button class="btn sec" onclick="$('dlg').close()">Batal</button></div>`;$('dlg').showModal()}
function sv(id){const g=k=>$('f_'+k).value.trim();if(!g('s')&&!g('n'))return alert('Isi No SPPT atau nama.');
  const o={s:g('s'),n:g('n'),w:g('w'),a:g('a'),o:g('o'),b:+g('b')||0,g:+g('g')||0,p:+g('p')||0,t:$('f_t').value};
  if(id)Object.assign(by(id),o);else D.push(Object.assign({id:Math.max(0,...D.map(x=>x.id))+1},o));D.forEach(norm);save();$('dlg').close();draw()}
function restore(){try{let d=JSON.parse($('bk').value),ar=null;if(!Array.isArray(d)){if(!Array.isArray(d.d))throw 0;ar=d.arsip;d=d.d}D=d;D.forEach(norm);save();if(Array.isArray(ar)){AR=ar.filter(a=>a&&a.th&&Array.isArray(a.data));AR.forEach(a=>a.data.forEach(norm));AR.sort((a,b)=>b.th-a.th);saveAR()}go()}catch(e){alert('Teks cadangan tidak valid.')}}
let AR=[],AV=null;try{AR=JSON.parse(localStorage.getItem(KEY+'_arsip')||'[]');AR.forEach(a=>a.data.forEach(norm))}catch(e){AR=[]}
let PEND=[];const SPR=/^\d{2}\.\d{2}\.\d{3}\./;
const num=v=>typeof v==='number'?Math.round(v):(parseInt(String(v).replace(/[^\d]/g,''))||0);
function stat(k,l){const x=(String(k||'')+' '+String(l||'')).toUpperCase();if(/BANK/.test(x))return'bank';if(/TITIP/.test(x))return'titip';if(/BELUM|BLM|TUNGGAK/.test(x))return'belum';return/LUNAS|SUDAH|SETOR|BAYAR/.test(x)?'lunas':'belum'}
function readX(f){if(!f)return;if(typeof XLSX==='undefined')return alert('Pustaka Excel gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.');
  const fr=new FileReader();fr.onerror=()=>{PEND=[];$('ap').disabled=true;$('pv').innerHTML='<div class="bad">Berkas gagal dibaca.</div>'};
  fr.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});let raw=[],sheet='';
    for(const nm of wb.SheetNames){const rr=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,defval:''}).filter(r=>SPR.test(String(r[1]).trim()));if(rr.length){raw=rr;sheet=nm;break}}
    const mp=new Map();let dup=0;
    raw.forEach(r=>{const o={s:String(r[1]).trim(),n:String(r[2]).trim(),w:String(r[3]).trim(),a:String(r[4]).trim(),o:String(r[5]).trim(),b:num(r[6]),g:num(r[7]),p:num(r[8]),t:stat(r[10],r[11])};if(mp.has(o.s))dup++;mp.set(o.s,o)});
    PEND=[...mp.values()];$('ap').disabled=!PEND.length;
    if(!PEND.length){$('pv').innerHTML='<div class="bad">Tidak ada baris dengan No SPPT yang dikenali di sheet mana pun. Pastikan No SPPT ada di kolom B dengan format seperti 35.17.020.002.001-0323.0.</div>';return}
    const L=PEND.filter(r=>r.t!=='belum').length,nol=PEND.filter(r=>!r.p).length;
    $('pv').innerHTML=`<div><b>${PEND.length} SPPT terbaca</b> dari sheet "${esc(sheet)}" · total pajak ${rp(sum(PEND,r=>r.p))} · lunas ${L} · belum lunas ${PEND.length-L}</div>
    ${dup?`<div class="wn" style="margin-top:4px">${dup} baris dengan No SPPT ganda digabung (baris terakhir dipakai).</div>`:''}${nol?`<div class="wn" style="margin-top:4px">${nol} SPPT bernilai pajak 0, periksa kolom I.</div>`:''}
    <div class="mut" style="margin:4px 0">Contoh 5 baris pertama, periksa apakah kolomnya sudah benar:</div><div class="wrap"><table><tr><th class="l">No SPPT</th><th class="l">Nama SPPT</th><th class="l">Wajib Pajak</th><th class="l">Alamat</th><th>Pajak</th><th class="l">Status</th></tr>${PEND.slice(0,5).map(r=>`<tr><td class="l">${esc(r.s)}</td><td class="l">${esc(r.n)}</td><td class="l">${esc(r.w)}</td><td class="l">${esc(r.a)}</td><td>${nf(r.p)}</td><td class="l">${ST[r.t]}</td></tr>`).join('')}</table></div>`}
  catch(err){PEND=[];$('ap').disabled=true;$('pv').innerHTML='<div class="bad">Berkas tidak bisa dibaca. Pastikan berformat .xlsx, .xls, atau .csv.</div>'}};fr.readAsArrayBuffer(f)}
function applyX(){if(!PEND.length)return;const mode=document.querySelector('input[name=md]:checked').value;let msg,arch='';
  if(mode==='ganti'){const yr=+$('ary').value,doAr=$('ar').checked&&D.length;
    if(doAr&&(!yr||yr<2000||yr>2100))return alert('Isi tahun arsip yang benar (2000 sampai 2100).');
    if(!confirm('Ganti SEMUA data sekarang dengan '+PEND.length+' SPPT dari Excel?'+(doAr?'\nData sekarang akan diarsipkan sebagai tahun '+yr+'.':'\nData sekarang TIDAK diarsipkan (masih bisa dikembalikan lewat tombol Kembalikan).')))return;
    if(doAr){if(arsipkan(yr,true)===false)return;arch=' Data lama diarsipkan sebagai tahun '+yr+'.'}}
  try{localStorage.setItem(KEY+'_prev',JSON.stringify(D))}catch(e){}
  if(mode==='ganti'){D=PEND.map((r,i)=>Object.assign({id:i+1},r));msg='Data diganti: '+D.length+' SPPT.'+arch}
  else{const m=new Map(D.map(r=>[r.s,r]));let up=0,ad=0,nid=Math.max(0,...D.map(x=>x.id))+1;const keep=!$('ts').checked;
    PEND.forEach(r=>{const o=m.get(r.s);if(o){const t=o.t;Object.assign(o,r);if(keep)o.t=t;up++}else{const n=Object.assign({id:nid++},r);D.push(n);m.set(n.s,n);ad++}});msg='Digabung: '+up+' SPPT diperbarui, '+ad+' SPPT baru ditambahkan.'}
  D.forEach(norm);save();PEND=[];alert(msg);go('daftar')}
function undoX(){try{const p=localStorage.getItem(KEY+'_prev');if(!p)return alert('Belum ada data sebelum import.');if(!confirm('Kembalikan data ke kondisi sebelum import terakhir?'))return;D=JSON.parse(p);D.forEach(norm);save();go('daftar')}catch(e){alert('Gagal mengembalikan data.')}}
function saveAR(){try{localStorage.setItem(KEY+'_arsip',JSON.stringify(AR));return true}catch(e){alert('Penyimpanan browser penuh, arsip tidak tersimpan. Hapus arsip lama atau salin cadangan dulu.');return false}}
function stats(a){const L=a.filter(r=>r.t!=='belum');return{n:a.length,tp:sum(a,r=>r.p),l:L.length,pl:sum(L,r=>r.p)}}
function arsipkan(th,quiet){th=+th;if(!th||th<2000||th>2100){alert('Isi tahun yang benar (2000 sampai 2100).');return false}
  if(!D.length){alert('Data aktif kosong, tidak ada yang diarsipkan.');return false}
  const i=AR.findIndex(a=>a.th===th);if(i>=0&&!confirm('Arsip tahun '+th+' sudah ada. Timpa dengan data sekarang?'))return false;
  const e={th,tgl:new Date().toISOString().slice(0,10),data:JSON.parse(JSON.stringify(D))};const bak=AR.slice();if(i>=0)AR[i]=e;else AR.push(e);AR.sort((a,b)=>b.th-a.th);
  if(!saveAR()){AR=bak;return false}if(!quiet)alert('Arsip tahun '+th+' tersimpan ('+D.length+' SPPT).');return true}
function exportX(th){if(typeof XLSX==='undefined')return alert('Pustaka Excel gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.');
  const a=th==='aktif'?{th:'Data aktif',data:D}:AR.find(x=>x.th===th);if(!a)return;
  const aoa=[['No','No SPPT','Nama sesuai SPPT','Nama wajib pajak','Alamat wajib pajak','Alamat obyek','Luas bumi','Luas bangunan','Setoran pajak','','Keterangan','Keterangan tambahan']];
  a.data.forEach((r,i)=>aoa.push([i+1,r.s,r.n,r.w,r.a,r.o,r.b,r.g,r.p,'',r.t==='belum'?'BELUM LUNAS':'LUNAS',r.t==='bank'?'Bank':r.t==='titip'?'Titip':'']));
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[5,26,24,24,18,24,10,12,13,3,14,16].map(w=>({wch:w}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'PBB '+a.th);
  XLSX.writeFile(wb,'PBB_Kepuhsari_'+(th==='aktif'?'data_aktif':th)+'.xlsx')}
function pulihA(th){const a=AR.find(x=>x.th===th);if(!a||!confirm('Pulihkan data aktif dari arsip tahun '+th+'? Data aktif sekarang akan diganti (masih bisa dikembalikan lewat tombol Kembalikan di menu Import Excel).'))return;
  try{localStorage.setItem(KEY+'_prev',JSON.stringify(D))}catch(e){}D=JSON.parse(JSON.stringify(a.data));D.forEach(norm);save();go('daftar')}
function hapusA(th){if(confirm('Hapus arsip tahun '+th+'? Tindakan ini tidak bisa dibatalkan.')){AR=AR.filter(x=>x.th!==th);saveAR();go()}}
function resetAll(){if(confirm('Kembalikan ke data awal dari Excel? Semua perubahan akan hilang.')){D=orig();save();go()}}
go();
</script>
